# Trust X-Forwarded-For ONLY from private/loopback ranges.
#
# This was `set_real_ip_from 0.0.0.0/0`, which trusted the header from ANY client —
# so any caller could spoof their source IP, defeating rate limiting and IP auditing.
# If you add Cloudflare or another CDN in front, add its published ranges here.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limit zone for the auth endpoints only.
# Deliberately NOT applied app-wide: staff commonly share one public IP behind NAT,
# and the SPA polls, so a global per-IP cap would lock out whole schools.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# === Gzip Compression ===
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/woff2;

# === Connection Tuning ===

# === Open File Cache ===
open_file_cache max=2000 inactive=20s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

server {
    listen 80;
    server_name tiko.school www.tiko.school;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tiko.school www.tiko.school;
    root /app/public;
    index index.php;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/tiko.school/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiko.school/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # HSTS: only safe because the :80 server block above unconditionally redirects to HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Security
    location ~ /\. { deny all; }
    location ~ /\.ht { deny all; }

    # Never serve source maps or dotfiles even if a build accidentally emits them.
    location ~* \.map$ { deny all; }

    # Brute-force damping on the auth endpoints. Laravel throttles as well; this is
    # the cheap outer layer that never reaches PHP-FPM (which only has a few workers).
    location = /login {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location = /forgot-password {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Static assets (cache aggressively)
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        open_file_cache max=1000 inactive=7d;
    }

    # Files on Laravel's "public" disk (storage/app/public).
    # Served via an alias rather than the public/storage symlink: this nginx image copies
    # public/ from the node build stage, which never contains that symlink.
    location /storage/ {
        alias /app/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        # Refuse to hand nginx-unresolvable paths to FPM (PATH_INFO script injection).
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host if_not_empty;
    }

    # Laravel Reverb WebSocket
    location /app/ {
        proxy_pass http://php:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
