[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log

[program:queue-worker]
command=php /app/artisan queue:work --tries=1 --timeout=90
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
user=www-data
stopasgroup=true
stopwaitsecs=90
stdout_logfile=/var/log/supervisor/queue-worker.log
stderr_logfile=/var/log/supervisor/queue-worker-error.log

[program:reverb]
command=php /app/artisan reverb:start
process_name=%(program_name)s
autostart=true
autorestart=true
user=www-data
stopasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/reverb.log
stderr_logfile=/var/log/supervisor/reverb-error.log

[program:cron]
command=crond -f -l 2
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron-error.log
