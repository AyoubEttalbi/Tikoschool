[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log

[program:queue-worker]
; No --tries here on purpose: the CLI flag OVERRIDES a job's own $tries/$backoff.
; With --tries=1, SendWhatsAppNotification's $tries=3 and $backoff=[10,30,60] were dead
; and a single transient API blip sent the job straight to failed_jobs.
; --max-time recycles the worker hourly so deployed code is picked up (opcache runs with
; validate_timestamps=0, so a long-lived worker would otherwise never see new code).
command=php /app/artisan queue:work --timeout=90 --max-time=3600 --sleep=3
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
user=www-data
stopasgroup=true
stopwaitsecs=90
stdout_logfile=/var/log/supervisor/queue-worker.log
stderr_logfile=/var/log/supervisor/queue-worker-error.log

[program:reverb]
command=php /app/artisan reverb:start
process_name=%(program_name)s
autostart=true
autorestart=true
user=www-data
stopasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/reverb.log
stderr_logfile=/var/log/supervisor/reverb-error.log

[program:cron]
command=crond -f -l 2
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron-error.log
