[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

; === Process Manager ===
; Static: all workers pre-forked, no spawn latency
pm = static
pm.max_children = 5
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 5
pm.max_requests = 500

; === Timeouts ===
request_terminate_timeout = 300s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; === Logging ===
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %{milli}d %{kilo}M"

; === Security ===
security.limit_extensions = .php

; === Environment ===
clear_env = no

; === Status page ===
pm.status_path = /fpm-status
ping.path = /fpm-ping
