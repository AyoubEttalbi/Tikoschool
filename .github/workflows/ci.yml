name: CI

on:
  push:
    branches: [main, local]
  pull_request:
    branches: [main, local]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & build
    runs-on: ubuntu-latest

    services:
      mysql:
        # MySQL, not sqlite: the app relies on MySQL-specific behaviour (JSON_LENGTH,
        # JSON_CONTAINS, DATE_FORMAT, invoice triggers, and the fact that double-quoted
        # tokens are string literals). Sqlite would diverge on exactly those queries.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: tikoschool_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, xml, gd, zip, bcmath, ctype, fileinfo
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tikoschool_test
          DB_USERNAME: root
          DB_PASSWORD: ci-root-password

      # Belt and braces. tests/Feature/RouteProtectionTest.php asserts the same thing, but
      # printing the table makes a regression obvious in the job log rather than buried in
      # an assertion diff. This is the check that would have caught a whole class of bug:
      # routes accidentally registered BELOW the closing brace of the auth group.
      - name: Show route middleware table
        run: php artisan route:list --columns=method,uri,name,middleware
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tikoschool_test
          DB_USERNAME: root
          DB_PASSWORD: ci-root-password

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Fail if a source map was emitted
        # Source maps would expose the unminified frontend, including any commented-out
        # endpoints and business logic.
        run: |
          if find public/build -name '*.map' -print -quit | grep -q .; then
            echo "::error::Source maps must not be built for production"
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: composer audit
        run: composer audit --no-dev || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        # Blocks on high/critical advisories that HAVE a fix, reports the ones that don't.
        #
        # `xlsx` carries two high advisories with no upgrade path: SheetJS left npm, so the
        # registry copy is frozen at 0.18.5. Both are parse-side (prototype pollution, ReDoS)
        # and this app only ever calls XLSX.writeFile — never XLSX.read — so no untrusted
        # spreadsheet is ever parsed. Failing every build on a vulnerability nobody can fix
        # just teaches people to ignore the job.
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e "
            const v = JSON.parse(require('fs').readFileSync('audit.json','utf8')).vulnerabilities || {};
            const blocking = [], unfixable = [];
            for (const [name, x] of Object.entries(v)) {
              if (!['high','critical'].includes(x.severity)) continue;
              (x.fixAvailable === false ? unfixable : blocking).push(name + ' (' + x.severity + ')');
            }
            if (unfixable.length) console.log('No fix available, not blocking: ' + unfixable.join(', '));
            if (blocking.length) {
              console.log('::error::Fixable high/critical advisories: ' + blocking.join(', ') + ' — run npm audit fix');
              process.exit(1);
            }
            console.log('No fixable high/critical advisories.');
          "

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block credentials in tracked files
        # A real production MySQL password was once committed in a markdown runbook.
        # This catches the obvious shapes before they reach the remote again.
        run: |
          set -e
          if git grep -nIE "(password|secret|api[_-]?key)[\"' ]*[:=][\"' ]*[A-Za-z0-9/+_-]{12,}" \
               -- . ':!*.lock' ':!.github/workflows/*' ':!*.example' > /tmp/hits.txt; then
            echo "::error::Possible hardcoded credential in a tracked file:"
            cat /tmp/hits.txt
            exit 1
          fi
          echo "No obvious credentials found."

      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          echo ".env is not tracked."
