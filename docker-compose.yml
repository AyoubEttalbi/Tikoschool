services:
  nginx:
    build:
      context: .
      target: nginx
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Needed by the `location /storage/` alias in default.conf. The nginx image builds
      # public/ from the node stage, which has no public/storage symlink (it is gitignored
      # and only created inside the php container), so files on the public disk would 404.
      - app_storage:/app/storage:ro
    depends_on:
      php:
        # Was a bare `- php`, which only waits for the container to be CREATED, not ready.
        # nginx therefore started before PHP-FPM was listening and served 502s on every deploy.
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the vhost is `listen 443 ssl http2` (IPv4 only, 0.0.0.0),
      # but busybox wget resolves localhost to ::1 first and gets ECONNREFUSED — so the
      # container reported unhealthy forever while serving 200s to the outside world.
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tikoschool
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  php:
    build:
      context: .
      target: php
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
    volumes:
      - app_storage:/app/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REVERB_SERVER_HOST=0.0.0.0
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Laravel already exposes /up (see bootstrap/app.php health: '/up'); nginx uses this
    # to avoid starting before PHP-FPM is accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - tikoschool
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 512M was not enough headroom for the absence-list PDF. This one container runs
          # php-fpm and all its workers, the queue runner and reverb under supervisor, and
          # a single PDF render peaks near 300 MB — so the request could be OOM-KILLED by
          # the kernel, taking the container with it, well before PHP's own memory_limit
          # produced a clean error. AttendanceController::PDF_MEMORY_LIMIT caps one
          # request at 384M; this leaves the rest of the container room to keep serving.
          # Budget check on the 3.9 GB host: 128 (nginx) + 768 + 1200 (mysql) + 128
          # (redis) = 2.2 GB of caps.
          memory: 768M

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      # No `:-secret` defaults: an unset variable used to silently boot MySQL with a
      # well-known password. `:?` makes compose refuse to start instead.
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # MUST differ from DB_PASSWORD. These were the SAME variable, so the application
      # user's password WAS the root password — any app-level leak was a full DB compromise.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required and must differ from DB_PASSWORD}
    # Not published on the host: nothing outside the compose network needs it, and the
    # app reaches it over the `tikoschool` bridge by service name.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tikoschool
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1200M

  redis:
    image: redis:7-alpine
    # requirepass added: Redis previously accepted unauthenticated connections from anything
    # on the host or on the compose network.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tikoschool
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # The WhatsApp gateway that actually delivers parent notifications.
  #
  # Deliberately NOT a dependency of php. The application is designed to run with this
  # service down — messages are HELD rather than failed, and released when it returns — so
  # making PHP wait on it would turn a recoverable outage into a site outage.
  #
  # `expose`, not `ports`: nothing outside the host may reach it. The API key is the only
  # thing between a caller and the school's WhatsApp account, and the /qr endpoint hands
  # out a credential that links a device to it.
  whatsapp:
    build:
      context: ./tools/whatsapp-gateway
    volumes:
      # The linked-device session. If this is not persistent, every deploy logs the school
      # out and somebody has to stand in front of the admin page with the school phone.
      - whatsapp_auth:/gateway/auth
    environment:
      - INSTANCE=${EVOLUTION_INSTANCE:-tikoschool}
      # Same value the application sends as its `apikey` header. Required, with no default:
      # gateway.mjs refuses to bind beyond loopback on the built-in development key.
      - GATEWAY_API_KEY=${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tikoschool
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Baileys is a WebSocket client, not a browser — this is nothing like the ~500 MB
          # a Puppeteer-based gateway would need. Host budget: 128 (nginx) + 768 (php)
          # + 1200 (mysql) + 128 (redis) + 256 = 2.5 GB of 3.9 GB.
          memory: 256M

volumes:
  app_storage:
  mysql_data:
  redis_data:
  whatsapp_auth:

networks:
  tikoschool:
    driver: bridge
