services:
  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/certs:/etc/letsencrypt:ro
      - app_storage:/app/storage:ro
    depends_on:
      - php
    networks:
      - tikoschool
    restart: unless-stopped

  php:
    build:
      context: .
      target: php
    volumes:
      - app_storage:/app/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REVERB_SERVER_HOST=0.0.0.0
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tikoschool
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tikoschool}
      MYSQL_USER: ${DB_USERNAME:-tikoschool}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - tikoschool
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - tikoschool
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
  redis_data:

networks:
  tikoschool:
    driver: bridge
